media:
  - name: images
    label: Website foto's
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

content:
  - name: website
    label: Website instellingen
    type: file
    path: data/site.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - {name: businessName, label: Bedrijfsnaam, type: string, required: true}
      - {name: tagline, label: Korte omschrijving (onderaan de website), type: string}
      - {name: phoneDisplay, label: Telefoonnummer zichtbaar, type: string, required: true}
      - {name: phoneHref, label: Telefoonnummer technisch (+31...), type: string, required: true}
      - {name: email, label: E-mailadres, type: string, required: true}
      - {name: whatsappUrl, label: WhatsApp-link, type: string, description: 'Bijvoorbeeld https://wa.me/31683936366'}
      - {name: whatsappMessage, label: Vooraf ingevuld WhatsApp-bericht, type: string}
      - {name: address, label: Volledig adres, type: string, required: true}
      - {name: addressLine1, label: Straat en huisnummer, type: string, required: true}
      - {name: postalCity, label: Postcode en plaats, type: string, required: true, description: 'Bijvoorbeeld 2904 EP Capelle aan den IJssel'}
      - {name: kvk, label: KvK-nummer, type: string}
      - {name: btw, label: BTW-nummer, type: string}

      - name: hero
        label: Bovenkant homepage
        type: object
        fields:
          - {name: title, label: Hoofdtitel, type: string, description: 'Houd "Thaise massage" en "Capelle aan den IJssel" erin, dat is goed voor Google.'}
          - {name: text, label: Introductietekst, type: text}
          - {name: primaryButton, label: Knop online boeken, type: string}
          - {name: secondaryButton, label: Knop behandelingen, type: string}
          - name: image
            label: Grote foto
            type: image
            options: {media: images}
          - {name: imageAlt, label: Beschrijving foto (voor Google en schermlezers), type: string}

      - name: booking
        label: Online boeken
        type: object
        fields:
          - {name: salonizedBookingUrl, label: Salonized boekingslink, type: string, description: 'Alle "Afspraak maken"-knoppen gaan naar deze link.'}

      - name: about
        label: Over Baitan
        type: object
        fields:
          - {name: title, label: Titel, type: string}
          - {name: text, label: Tekst, type: text}
          - name: image
            label: Foto
            type: image
            options: {media: images}
          - {name: imageAlt, label: Beschrijving foto, type: string}
          - name: facts
            label: Korte kenmerken
            type: string
            list: true

      - name: giftCard
        label: Cadeaubon
        type: object
        fields:
          - {name: enabled, label: Tonen, type: boolean}
          - {name: title, label: Titel, type: string}
          - {name: text, label: Tekst, type: text}
          - {name: button, label: Knoptekst, type: string}

      - name: loyalty
        label: Spaarkaart
        type: object
        fields:
          - {name: enabled, label: Tonen, type: boolean}
          - {name: title, label: Titel, type: string}
          - {name: text, label: Tekst, type: text}
          - {name: button, label: Knoptekst, type: string}

      - name: reviews
        label: Google reviews
        type: object
        fields:
          - {name: rating, label: Gemiddelde score, type: number}
          - {name: count, label: Aantal reviews, type: number}
          - {name: url, label: Google Reviews-link, type: string}
          - {name: writeUrl, label: Google review schrijven-link, type: string}

      - name: faq
        label: Veelgestelde vragen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - {name: question, label: Vraag, type: string, required: true}
          - {name: answer, label: Antwoord, type: text, required: true}

      - name: opening
        label: Openingstijden
        type: object
        fields:
          - {name: weekdayLabel, label: Dagen doordeweeks, type: string}
          - {name: weekdayOpen, label: Openingstijd doordeweeks, type: string}
          - {name: weekdayClose, label: Sluitingstijd doordeweeks, type: string}
          - {name: weekendLabel, label: Dagen weekend, type: string}
          - {name: weekendOpen, label: Openingstijd weekend, type: string}
          - {name: weekendClose, label: Sluitingstijd weekend, type: string}

      - name: contact
        label: Contact & route
        type: object
        fields:
          - {name: routeUrl, label: Google Maps route-link, type: string}
          - {name: mapEmbedUrl, label: Google Maps embed-link, type: string}

      - name: seo
        label: Google / SEO
        type: object
        fields:
          - {name: title, label: SEO-titel homepage, type: string, description: 'Maximaal ± 60 tekens.'}
          - {name: description, label: Meta description homepage, type: text, description: 'Maximaal ± 155 tekens.'}
          - {name: canonical, label: Definitieve website-URL, type: string, description: 'Bijvoorbeeld https://baitanmassage.nl'}
          - {name: googleSiteVerification, label: Google Search Console verificatiecode, type: string, description: 'Alleen de content-waarde uit de google-site-verification meta-tag.'}

  - name: treatments
    label: Massages & prijzen
    type: file
    path: data/treatments.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - {name: id, label: Technische ID, type: string, required: true, readonly: true}
      - {name: name, label: Naam massage, type: string, required: true}
      - {name: slug, label: SEO URL, type: string, required: true, readonly: true}
      - {name: active, label: Tonen op website, type: boolean}
      - {name: showPage, label: Eigen pagina, type: boolean, description: 'Uit = alleen in de prijslijst, zonder eigen pagina.'}
      - {name: description, label: Korte omschrijving (in de lijst), type: text}
      - {name: h1, label: Titel op de eigen pagina, type: string}
      - {name: lead, label: Introductie op de eigen pagina, type: text}
      - {name: detailText, label: Uitgebreide behandeltekst, type: text, description: 'Laat een lege regel tussen alinea''s.'}
      - name: steps
        label: Zo verloopt je behandeling
        type: object
        list: true
        fields:
          - {name: title, label: Stap, type: string}
          - {name: text, label: Uitleg, type: string}
      - {name: seoTitle, label: SEO-titel behandelpagina, type: string}
      - {name: seoDescription, label: Meta description behandelpagina, type: text}
      - name: image
        label: Foto bij massage
        type: image
        options: {media: images}
      - {name: imageAlt, label: Beschrijving foto, type: string}
      - name: durations
        label: Duur en prijs
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{minutes} min — €{price}"
        fields:
          - {name: minutes, label: Minuten, type: number, required: true}
          - {name: price, label: Prijs per persoon in euro, type: number, required: true}
          - {name: duoPrice, label: Prijs duo (twee personen) in euro, type: number}

settings:
  commit:
    identity: app
    templates:
      update: "Baitan website aangepast via Pages CMS: {path}"

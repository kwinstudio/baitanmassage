name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair WebP assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path("assets/images")
          repair = [
              "hot-stone-massage.webp",
              "thai-back-massage.webp",
              "thai-hand-massage.webp",
              "thai-herbal-compress.webp",
              "thai-leg-massage.webp",
              "thai-oil-massage.webp",
              "thai-shoulder-closeup.webp",
              "thai-shoulder-massage.webp",
          ]

          for name in repair:
              path = root / name
              with Image.open(path) as im:
                  im.convert("RGB").save(path, "WEBP", quality=82, method=6)

          # The old head-massage file is not browser-decodable; rebuild it
          # from the valid close-up source so no broken image can remain.
          with Image.open(root / "thai-shoulder-closeup.webp") as im:
              im.convert("RGB").save(root / "thai-head-massage.webp", "WEBP", quality=82, method=6)
              im.convert("RGB").save(root / "massage-head.webp", "WEBP", quality=82, method=6)
          PY
      - name: Commit repaired image assets
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- assets/images; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/images
            git commit -m "Herstel massagefoto's voor alle browsers"
            git push
          fi
      - name: Build static site
        run: python3 build.py
      - name: Verify SEO outputs
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q "hero-immersive" dist/index.html
          grep -q 'class="brand" href="/"' dist/index.html
          test -f dist/assets/images/thai-head-massage.webp
          test -f dist/assets/images/hot-stone-massage.webp
          test -f dist/assets/images/thai-leg-massage.webp
          test -f dist/assets/images/thai-hand-massage.webp
          test -f dist/assets/images/thai-back-massage.webp
          test -f dist/assets/images/thai-oil-massage.webp
          test -f dist/assets/images/thai-shoulder-massage.webp
          test -f dist/assets/images/thai-shoulder-closeup.webp
          test -f dist/assets/images/thai-herbal-compress.webp
          test -f dist/404.html
          test -f dist/massages.html
          test -f dist/prijzen.html
          test -f dist/contact.html
          test -f dist/thaise-massage-capelle-aan-den-ijssel.html
          test -f dist/aromatherapie-massage-capelle.html
          test -f dist/sportmassage-capelle.html
          test -f dist/hot-stone-massage-capelle.html
          test -f dist/duo-massage-capelle.html
          grep -q "Thaise Massage Capelle aan den IJssel" dist/index.html
          grep -q "sitemap.xml" dist/robots.txt
          grep -q "thaise-massage-capelle-aan-den-ijssel" dist/sitemap.xml
          grep -q "FAQPage" dist/index.html
          grep -q "HealthAndBeautyBusiness" dist/index.html
          grep -q "max-image-preview:large" dist/index.html
          grep -q 'hreflang="nl-NL"' dist/index.html
          grep -q "image:image" dist/sitemap.xml
          grep -q "Thaise massage in Capelle" dist/index.html
          grep -q 'name="robots" content="noindex,follow"' dist/privacy.html
          grep -q 'name="robots" content="noindex,follow"' dist/voorwaarden.html

      - name: Upload rendered site artifact
        uses: actions/upload-artifact@v4
        with:
          name: baitan-rendered-site
          path: dist/
          if-no-files-found: error
          retention-days: 3

name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate WebP assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path("assets/images")
          files = sorted(root.glob("*.webp"))
          if not files:
              raise SystemExit("Geen WebP-assets gevonden")

          for path in files:
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  width, height = im.size
                  if width < 320 or height < 240:
                      raise SystemExit(f"Afbeelding te klein: {path} ({width}x{height})")
              print(f"OK {path}")
          PY

      - name: Build static site
        run: python3 build.py
      - name: Verify SEO outputs
        run: |
          set -e
          for f in index massages prijzen contact voorwaarden privacy 404 \
                   thaise-massage-capelle-aan-den-ijssel aromatherapie-massage-capelle \
                   sportmassage-capelle hot-stone-massage-capelle duo-massage-capelle; do
            test -f "dist/$f.html"
            test "$(grep -o '<h1' "dist/$f.html" | wc -l)" -eq 1
          done
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/og-image.jpg
          test -f dist/fonts/newsreader.woff2
          test -f dist/fonts/figtree.woff2
          grep -q "sitemap.xml" dist/robots.txt
          grep -q "thaise-massage-capelle-aan-den-ijssel" dist/sitemap.xml
          grep -q "image:image" dist/sitemap.xml
          grep -q 'class="brand" href="/"' dist/index.html
          grep -q "Thaise massage in Capelle aan den IJssel" dist/index.html
          grep -q "FAQPage" dist/index.html
          grep -q "HealthAndBeautyBusiness" dist/index.html
          grep -q "BreadcrumbList" dist/thaise-massage-capelle-aan-den-ijssel.html
          grep -q "max-image-preview:large" dist/index.html
          grep -q 'hreflang="nl-NL"' dist/index.html
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'name="robots" content="noindex,follow"' dist/privacy.html
          grep -q 'name="robots" content="noindex,follow"' dist/voorwaarden.html
          python3 - <<'PY'
          import json, re, pathlib
          for f in pathlib.Path("dist").glob("*.html"):
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', f.read_text(), re.S):
                  json.loads(block)
          print("JSON-LD OK")
          PY

      - name: Upload rendered site artifact
        uses: actions/upload-artifact@v4
        with:
          name: baitan-rendered-site
          path: dist/
          if-no-files-found: error
          retention-days: 3
